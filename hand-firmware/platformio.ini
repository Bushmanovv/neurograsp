; =============================================================================
;  EEG-controlled InMoov prosthetic hand  —  ESP32 firmware (PlatformIO)
;
;  Layer 0: scaffold only. Later layers add GPIO servo control, WiFi AP,
;  the async web server + WebSocket, and (stretch) a Three.js 3D twin.
; =============================================================================

[platformio]
; Board detected as ESP32-D0WD-V3 with 4 MB flash → use the 4 MB env.
; (Switch back to esp32dev_8mb only if you move to a real 8 MB board.)
default_envs = esp32dev_4mb

; Options here apply to EVERY [env:*] below.
[env]
; deep+ makes the Library Dependency Finder scan all library sources so the
; async web-server / TCP forks resolve their transitive includes reliably.
lib_ldf_mode = deep+
; Stage a gzipped copy of data/ into the build dir before building/uploading
; the filesystem image. Keeps data/ readable for local preview while the
; device serves small .gz files (ESPAsyncWebServer picks them up natively).
extra_scripts = pre:tools/prep_fs.py

; -----------------------------------------------------------------------------
;  ALTERNATE TARGET  —  generic ESP32 dev board with 8 MB flash.
;
;  The default env is esp32dev_4mb (the real hardware). Use this one only if you
;  move to a board that actually HAS 8 MB of flash — it hands more of the part
;  to LittleFS (room for the Three.js stretch goal + a decimated GLB model).
; -----------------------------------------------------------------------------
[env:esp32dev_8mb]
platform = espressif32
board = esp32dev
framework = arduino

; Use the whole 8 MB and a custom partition table that gives LittleFS ~4.8 MB
; (room for index.html + app.js + style.css + Three.js + a decimated model).
board_upload.flash_size = 8MB
board_build.flash_size = 8MB
board_build.partitions = partitions_8mb.csv
board_build.filesystem = littlefs

monitor_speed = 115200
upload_speed = 921600

; --- Libraries ---------------------------------------------------------------
; Servos are driven directly from ESP32 GPIOs (no PCA9685), so ESP32Servo is the
; only servo dependency — it drives the pins via the ESP32 LEDC peripheral.
; NOTE on the async web server: there are several forks of ESPAsyncWebServer /
; AsyncTCP and the registry naming is a frequent source of pain. We pin the
; actively-maintained ESP32Async forks by git URL so the build is reproducible.
lib_deps =
    madhephaestus/ESP32Servo @ ^3.0.5
    bblanchon/ArduinoJson @ ^7.2.0
    https://github.com/ESP32Async/AsyncTCP.git
    https://github.com/ESP32Async/ESPAsyncWebServer.git

build_flags =
    -DCORE_DEBUG_LEVEL=3          ; Arduino-ESP32 log verbosity (0..5)
    -DASYNCWEBSERVER_REGEX=1      ; enables regex routes + request->pathArg()
                                  ;   (used by DELETE /api/poses/<name>)


; -----------------------------------------------------------------------------
;  PRIMARY TARGET  —  4 MB flash board (the real hardware: ESP32-D0WD-V3).
;
;  Custom partition table: single 1.75 MB app slot + ~2.1 MB LittleFS.
;  (The stock min_spiffs.csv only gives the FS 128 KB — the web app does not
;  fit.) Assets are gzipped by tools/prep_fs.py, so the whole dashboard incl.
;  Three.js is ~300 KB on flash; a future models/hand.glb also has room.
; -----------------------------------------------------------------------------
[env:esp32dev_4mb]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = partitions_4mb.csv
board_build.filesystem = littlefs
monitor_speed = 115200
upload_speed = 921600
lib_deps = ${env:esp32dev_8mb.lib_deps}
build_flags = ${env:esp32dev_8mb.build_flags}
